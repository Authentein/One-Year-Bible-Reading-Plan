<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>75 Soft Tracker</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="75 Soft">
<meta name="theme-color" content="#0b0d12">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#0b0d12;--panel:#0f1218;--panel2:#12151c;--line:#1a2230;--ink:#dde0e8;--white:#fff;
  --dim:#7a9ab8;--eyebrow:#6a90bb;--muted:#556677;--green:#7edfa0;--gold:#dfca7e;--purple:#c89edf;
  --blue:#7eb8df;--mono:'SF Mono','Fira Code',Consolas,monospace}
body{background:var(--bg);color:var(--ink);font-family:Georgia,serif;min-height:100vh;padding-bottom:40px}
button{font-family:inherit;cursor:pointer}
.hdr{background:linear-gradient(135deg,#1a2a45 0%,#0d1420 100%);padding:14px 18px;border-bottom:1px solid #2a3a55}
.hdr .row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.eyebrow{font-size:10px;letter-spacing:.2em;color:var(--eyebrow);font-family:var(--mono);text-transform:uppercase;margin-bottom:3px}
.title{font-size:20px;font-weight:bold;color:var(--white)}
.sub{font-size:11px;color:var(--dim);margin-top:2px}
.startsel{display:flex;gap:6px;align-items:center;font-family:var(--mono);font-size:11px;color:var(--dim)}
.startsel input{background:#16202e;border:1px solid #2a3a55;color:var(--ink);border-radius:5px;padding:4px 8px;font-size:12px;font-family:var(--mono);color-scheme:dark}
.yearsel{display:flex;gap:6px;align-items:center;font-family:var(--mono);font-size:11px;color:var(--dim)}
.btn{background:#16202e;border:1px solid #2a3a55;color:var(--ink);border-radius:5px;padding:5px 10px;font-size:12px;font-family:var(--mono)}
.btn:disabled{opacity:.35;cursor:default}
.btn.on{background:#1a2e4a;border-color:var(--blue);color:var(--white)}
.bar{background:var(--panel);border-bottom:1px solid var(--line);padding:12px 16px}
.stack{max-width:728px;margin:0 auto;display:flex;flex-direction:column;gap:6px}
.stack .chip{display:block;padding:7px 12px;font-size:13px;letter-spacing:.03em}
.stack .t1{background:#08201f;border-color:#2f7a74;color:#6fd8cf}
.stack .t2{background:#26160c;border-color:#7a4a2a;color:#e8a374}
.stack .t3{background:#260c16;border-color:#7a2f48;color:#ec8aa6}
.stack .track{width:100%;margin-top:4px}
.chip{background:#0a2a1a;border:1px solid #3a8a5a;border-radius:4px;padding:2px 10px;font-size:11px;color:var(--green);font-family:var(--mono);font-weight:bold}
.chip.gold{background:#241f0f;border-color:#6a5a2a;color:var(--gold)}
.chip.purple{background:#1a0f24;border-color:#4a3a66;color:var(--purple)}
.track{flex:1;min-width:120px;height:6px;background:#1a2230;border-radius:3px;overflow:hidden}
.track i{display:block;height:100%;background:linear-gradient(90deg,#3a8a5a,var(--green))}
.tabs{display:flex;border-bottom:1px solid var(--line);background:var(--panel2)}
.tab{flex:1;padding:11px 8px;border:none;background:transparent;color:var(--muted);font-family:var(--mono);font-size:12px;border-bottom:2px solid transparent}
.tab.on{color:var(--white);border-bottom-color:var(--blue);font-weight:bold}
.wrap{max-width:760px;margin:0 auto;padding:16px}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.daynav .when{text-align:center;flex:1}
.daynav .d1{font-size:17px;color:var(--white);font-weight:bold}
.daynav .d2{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:2px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px}
.read{display:flex;align-items:center;gap:12px;border-left:3px solid var(--blue)}
.read.ps{border-left-color:var(--purple)} .read.pr{border-left-color:var(--gold)}
.read .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.read .ref{font-size:18px;color:var(--white);margin-top:2px}
.read .grow{flex:1}
.read .open{text-decoration:none;white-space:nowrap;font-family:var(--mono);font-size:11px;color:var(--blue);background:none;border:1px solid #2a3a55;border-radius:5px;padding:5px 9px}
.done-btn{width:100%;padding:13px;border-radius:8px;border:1px solid #3a8a5a;background:#0a2a1a;color:var(--green);font-family:var(--mono);font-size:14px;font-weight:bold;margin-top:4px}
.done-btn.is{background:var(--green);color:#06140c}
.note{font-size:11px;color:var(--muted);font-style:italic;line-height:1.5;margin-top:10px}
.mtabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.mtabs .btn{flex:0 0 auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#1a2e4a;color:var(--white);font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;padding:7px 6px;text-align:left}
td{padding:7px 6px;border-bottom:1px solid #141a24;vertical-align:middle}
tr.past td{color:var(--muted)}
tr.today td{background:#2a2410;color:var(--gold);font-weight:bold}
tr.row{cursor:pointer}
tr.row:hover td{background:#141a24}
td.c{text-align:center;font-family:var(--mono)}
.cb{width:20px;height:20px;border-radius:4px;border:1px solid #2a3a55;display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:#06140c}
.cb.on{background:var(--green);border-color:var(--green)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.stat .k{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-size:24px;color:var(--white);margin-top:4px;font-family:var(--mono)}
.stat .v small{font-size:12px;color:var(--dim)}
.foot{text-align:center;font-family:var(--mono);font-size:10px;color:#334455;margin-top:22px;line-height:1.8}
@media (max-width:520px){.title{font-size:17px}.hide-sm{display:none}td,th{padding:6px 4px}}

.task{display:flex;align-items:center;gap:12px;border-left:3px solid var(--blue);cursor:pointer;user-select:none}
.task.k1{border-left-color:var(--gold)} .task.k2{border-left-color:var(--blue)} .task.k3{border-left-color:#b8df7e} .task.k4{border-left-color:var(--purple)} .task.k5{border-left-color:#c8ccd6}
.task .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.task .ref{font-size:18px;color:var(--white);margin-top:2px}
.task .grow{flex:1}
.task .box{width:30px;height:30px;border-radius:6px;border:1px solid #2a3a55;display:flex;align-items:center;justify-content:center;font-size:17px;color:#06140c;flex:0 0 auto}
.task.on{background:#101a14}
.task.on .box{background:var(--green);border-color:var(--green)}
.task.on .ref{color:var(--dim);text-decoration:line-through;text-decoration-color:#3a5a48}
.done-btn:disabled{cursor:default;opacity:.5}
.done-btn.part{border-color:#2a3a55;background:#16202e;color:var(--dim)}
td .cb{cursor:pointer}
</style>
</head>
<body>
<div class="hdr"><div class="row">
  <div>
    <div class="eyebrow">Daily Challenge Tracker</div>
    <div class="title">75 Soft</div>
    <div class="sub">Diet · Exercise · Water · Reading · Prayer</div>
  </div>
  <label class="startsel">START <input type="date" id="startIn"></label>
</div></div>

<div class="bar"><div class="stack">
  <span class="chip t1" id="chipDay"></span>
  <span class="chip t2" id="chipDone"></span>
  <span class="chip t3" id="chipStreak"></span>
  <div class="track"><i id="trackFill"></i></div>
</div></div>

<div class="tabs">
  <button class="tab on" data-v="day">Today</button>
  <button class="tab" data-v="plan">Full Plan</button>
  <button class="tab" data-v="stats">Progress</button>
</div>

<div class="wrap" id="view"></div>

<script>
const N=75;
const TASKS=[
  {id:"diet", lbl:"Diet",     ref:"Follow diet",                 short:"Diet"},
  {id:"train",lbl:"Exercise", ref:"45 minutes of exercise",           short:"Exer"},
  {id:"water",lbl:"Water",    ref:"Drink half of body weight in water",      short:"Water"},
  {id:"read", lbl:"Reading",  ref:"Read 10 pages",                    short:"Read"},
  {id:"pray", lbl:"Prayer",   ref:"Prayer",                   short:"Pray"}];
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const STORE="soft75_v1";

const now=new Date();
const mid=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);};

let state={start:iso(now),done:{}};
try{const s=localStorage.getItem(STORE);if(s){const p=JSON.parse(s);if(p&&p.start&&p.done)state=p;}}catch(e){}
function save(){try{localStorage.setItem(STORE,JSON.stringify(state));}catch(e){}}

const startDate=()=>parse(state.start);
const dateOf=d=>{const s=startDate();return new Date(s.getFullYear(),s.getMonth(),s.getDate()+d);};
const rawIdx=()=>Math.round((mid(now)-startDate())/864e5);
const todayIdx=()=>{const r=rawIdx();return r>=0&&r<N?r:-1;};
const k=(d,t)=>d+"-"+t;
const has=(d,t)=>!!state.done[k(d,t)];
const cnt=d=>TASKS.reduce((s,t)=>s+(has(d,t.id)?1:0),0);
const full=d=>cnt(d)>=3;
function tog(d,t){const x=k(d,t);if(state.done[x])delete state.done[x];else state.done[x]=1;save();}

let r0=rawIdx();
let cur=Math.max(0,Math.min(N-1,r0)), view="day", week=Math.floor(cur/7);

function streak(){let d=Math.min(rawIdx(),N-1);if(d<0)return 0;let s=0;if(!full(d))d--;while(d>=0&&full(d)){s++;d--;}return s;}
function best(){let b=0,s=0;for(let d=0;d<N;d++){if(full(d)){s++;b=Math.max(b,s);}else s=0;}return b;}
function doneCount(){let n=0;for(let d=0;d<N;d++)if(full(d))n++;return n;}
const pl=(n,w)=>`${n} ${w}${n===1?"":"s"}`;

function renderBar(){const dc=doneCount(),r=rawIdx();
  document.getElementById("startIn").value=state.start;
  document.getElementById("chipDay").textContent=r<0?`Current Day: Starts in ${pl(-r,"Day")}`:r>=N?`Current Day: Finished (${N} of ${N})`:`Current Day: ${r+1} of ${N}`;
  document.getElementById("chipDone").textContent=`Total Complete: ${pl(dc,"Day")}`;
  document.getElementById("chipStreak").textContent=`Current Streak: ${pl(streak(),"Day")}`;
  document.getElementById("trackFill").style.width=(dc/N*100)+"%";}

function renderDay(){cur=Math.max(0,Math.min(N-1,cur));
  const dt=dateOf(cur),isToday=cur===todayIdx(),c=cnt(cur),all=c>=3;
  return `<div class="daynav">
    <button class="btn" id="dPrev" ${cur===0?"disabled":""}>◀</button>
    <div class="when"><div class="d1">${DOW[dt.getDay()]}, ${MONTHS[dt.getMonth()]} ${dt.getDate()}</div>
      <div class="d2">DAY ${cur+1} OF ${N}${isToday?" · TODAY":""}</div></div>
    <button class="btn" id="dNext" ${cur===N-1?"disabled":""}>▶</button></div>
  ${!isToday&&todayIdx()>=0?`<div style="text-align:center;margin-bottom:10px"><button class="btn" id="goToday">● Jump to today</button></div>`:""}
  ${TASKS.map((t,i)=>{const on=has(cur,t.id);return `<div class="card task k${i+1} ${on?"on":""}" data-task="${t.id}">
    <div class="grow"><div class="lbl">${t.lbl}</div><div class="ref">${t.ref}</div></div>
    <div class="box">${on?"✓":""}</div></div>`;}).join("")}
  <button class="done-btn ${all?"is":"part"}" id="toggleAll" ${all?"":"disabled"}>Day Complete</button>`;}

function renderPlan(){const ti=todayIdx(),r=rawIdx(),weeks=Math.ceil(N/7);let rows="";
  const a=week*7,b=Math.min(N-1,a+6);
  for(let d=a;d<=b;d++){const dt=dateOf(d);
    const cls=d===ti?"today":(d<r?"past":"");
    rows+=`<tr class="row ${cls}" data-day="${d}"><td class="c hide-sm">${d+1}</td><td>${DOW[dt.getDay()]} ${MONTHS[dt.getMonth()].slice(0,3)} ${dt.getDate()}</td>
      ${TASKS.map(t=>{const on=has(d,t.id);return `<td class="c"><span class="cb ${on?"on":""}" data-cell="${d}|${t.id}">${on?"✓":""}</span></td>`;}).join("")}
      <td class="c">${full(d)?'<span style="color:var(--green)">●</span>':cnt(d)?`${cnt(d)}/${TASKS.length}`:""}</td></tr>`;}
  return `<div class="mtabs">${Array.from({length:weeks},(_,i)=>`<button class="btn ${i===week?"on":""}" data-week="${i}">Wk ${i+1}</button>`).join("")}</div>
  <table><thead><tr><th class="hide-sm" style="width:40px">Day</th><th>Date</th>${TASKS.map(t=>`<th style="width:40px;text-align:center;padding:7px 2px">${t.short}</th>`).join("")}<th style="width:40px"></th></tr></thead>
  <tbody>${rows}</tbody></table>`;}

function renderStats(){const r=rawIdx(),dc=doneCount();let tasks=0;for(let d=0;d<N;d++)tasks+=cnt(d);
  let missed=0;for(let d=0;d<Math.min(r,N);d++)if(!full(d))missed++;
  const byTask=TASKS.map(t=>{let c=0;for(let d=0;d<N;d++)if(has(d,t.id))c++;
    return `<div style="display:flex;align-items:center;gap:10px;margin:6px 0;font-family:var(--mono);font-size:11px"><span style="width:44px;color:var(--dim)">${t.short}</span>
      <div class="track"><i style="width:${c/N*100}%"></i></div><span style="width:52px;text-align:right">${c}/${N}</span></div>`;}).join("");
  const byWeek=Array.from({length:Math.ceil(N/7)},(_,w)=>{const a=w*7,b=Math.min(N-1,a+6);let c=0;for(let d=a;d<=b;d++)if(full(d))c++;
    return `<div style="display:flex;align-items:center;gap:10px;margin:6px 0;font-family:var(--mono);font-size:11px"><span style="width:44px;color:var(--dim)">Wk ${w+1}</span>
      <div class="track"><i style="width:${c/(b-a+1)*100}%"></i></div><span style="width:52px;text-align:right">${c}/${b-a+1}</span></div>`;}).join("");
  return `<div class="stats">
    <div class="card stat"><div class="k">Days complete</div><div class="v">${dc} <small>/ ${N}</small></div></div>
    <div class="card stat"><div class="k">Tasks done</div><div class="v">${tasks} <small>/ ${N*TASKS.length}</small></div></div>
    <div class="card stat"><div class="k">Longest streak</div><div class="v">${best()} <small>days</small></div></div>
    <div class="card stat"><div class="k">Missed days</div><div class="v">${r>0?missed:0} <small>days</small></div></div></div>
  <div class="card"><div class="lbl" style="font-family:var(--mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:6px">By task</div>${byTask}</div>
  <div class="card"><div class="lbl" style="font-family:var(--mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:6px">By week</div>${byWeek}</div>
  <div style="text-align:center;margin-top:14px"><button class="btn" id="restart">Restart challenge from today</button></div>`;}

function render(){renderBar();
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.v===view));
  const v=document.getElementById("view");
  v.innerHTML=view==="day"?renderDay():view==="plan"?renderPlan():renderStats();
  const on=v.querySelector(".mtabs .btn.on");if(on)on.scrollIntoView({inline:"center",block:"nearest"});}

document.getElementById("startIn").addEventListener("change",e=>{const v=e.target.value;if(!v)return;
  state.start=v;save();const r=rawIdx();cur=Math.max(0,Math.min(N-1,r));week=Math.floor(cur/7);render();});

document.addEventListener("click",e=>{const t=e.target.closest("button,[data-cell],[data-task],tr.row");if(!t)return;
  if(t.classList.contains("tab")){view=t.dataset.v;if(view==="plan")week=Math.floor(cur/7);render();return;}
  if(t.id==="dPrev"){cur--;render();return;}
  if(t.id==="dNext"){cur++;render();return;}
  if(t.id==="goToday"){cur=todayIdx();render();return;}
  if(t.dataset.task){tog(cur,t.dataset.task);render();return;}
  if(t.dataset.week!==undefined){week=+t.dataset.week;render();return;}
  if(t.dataset.cell){e.stopPropagation();const [d,id]=t.dataset.cell.split("|");tog(+d,id);render();return;}
  if(t.classList.contains("row")){cur=+t.dataset.day;view="day";render();window.scrollTo(0,0);return;}
  if(t.id==="restart"){if(confirm("Clear all progress and restart Day 1 today?")){state={start:iso(now),done:{}};save();cur=0;week=0;render();}return;}
});
try{render();}catch(err){document.getElementById("view").innerHTML=`<div class="card" style="color:#df7e7e">Something went wrong loading the tracker: ${err.message}</div>`;}
</script>
</body>
</html>
